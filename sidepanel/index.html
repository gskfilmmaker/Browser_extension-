<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Browser Agent</title><link rel="stylesheet" href="../ui.css"></head><body class="panel"><header><div class="brand">✦</div><div><h1>AI Browser Agent</h1><small>Your browser, with a copilot</small></div><button id="settings" class="icon" title="Open settings" aria-label="Open settings">⚙</button></header><div class="toolbar"><label for="mode">Permission mode</label><select id="mode"><option value="ask">Ask before every action</option><option value="auto">Auto with safety checks</option><option value="trusted">Trusted sites only</option></select></div><div id="status" role="status">Ready</div><main id="messages" aria-label="Conversation"><div class="welcome"><span>✦</span><h2>A little help,<br>right where you browse.</h2><p>Read a page, compare tabs, or get help with a task. You approve actions before they happen.</p></div></main><section id="approval" hidden aria-label="Action approval"></section><footer><form id="chat"><label for="prompt" class="sr-only">Message</label><textarea id="prompt" placeholder="What would you like to do?" rows="3" maxlength="16000" required></textarea><div class="composer-actions"><button type="button" id="clear" class="quiet">New chat</button><button type="button" id="stop" class="quiet" hidden>Stop</button><button type="submit" id="send">Send ↗</button></div></form><small>Page data is sent to your selected AI provider.</small></footer><script type="module" src="app.js"></script></body></html>
